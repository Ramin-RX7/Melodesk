name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check (types, lint, format, changelog, unit tests)
    runs-on: ubuntu-latest
    env:
      # The checks never start Electron, so skip its ~100 MB download.
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Typecheck (source + tests), lint, format, changelog and the Vitest suites.
      - run: npm run check

      # Coverage is reported, never enforced.
      - run: npm run test:coverage

      - uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ github.sha }}
          path: coverage/
          retention-days: 7

  build:
    name: Build (${{ matrix.platform }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run build:${{ matrix.platform }}

      - uses: actions/upload-artifact@v7
        with:
          name: melodesk-${{ matrix.platform }}-${{ github.sha }}
          path: |
            release/*.exe
            release/*.zip
            release/*.AppImage
          if-no-files-found: error
          retention-days: 7
