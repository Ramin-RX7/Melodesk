# Builds the app and drafts a GitHub release. See CLAUDE.md §4 → Releasing.
#
# - Pushing a tag `v<version>` (made by `npm run release`): runs the checks, builds the Windows
#   installer, portable exe and portable zip, the Linux AppImage and the macOS dmgs, and creates
#   a draft release with those files, SHA256SUMS.txt and that version's CHANGELOG.md section
#   (plus .github/release-footer.md) as the description. Publish the draft by hand.
# - Run manually (Actions → Release → Run workflow):
#   - on a branch: builds only. The files are attached to the workflow run, for testing a build
#     without releasing.
#   - on a tag ("Use workflow from" → Tags → vX.Y.Z): builds and drafts that tag's release, e.g.
#     when the tag push didn't trigger the workflow.
# - Re-running it for a tag whose release already exists replaces its files and description.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    env:
      # The checks never start Electron, so skip its ~100 MB download.
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check

      - name: Check the tag matches package.json
        id: meta
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version (expected v$version). Make releases with 'npm run release'."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # A version like 1.2.0-beta.1 becomes a GitHub pre-release.
          if [[ "$version" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Write release notes
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          node scripts/changelog.mjs notes "${{ steps.meta.outputs.version }}" > release-notes.md
          printf '\n' >> release-notes.md
          cat .github/release-footer.md >> release-notes.md
          cat release-notes.md

      - if: github.ref_type == 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md
          retention-days: 7

  build:
    name: Build (${{ matrix.platform }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: mac
    runs-on: ${{ matrix.os }}
    env:
      # No code-signing certificates: build unsigned installers.
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build:${{ matrix.platform }}
      - uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.platform }}
          path: |
            release/*.exe
            release/*.zip
            release/*.AppImage
            release/*.dmg
          if-no-files-found: error
          retention-days: 7

  release:
    name: Draft GitHub release
    if: github.ref_type == 'tag'
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: build-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: release-notes

      - name: Write checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Create or update the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" > /dev/null 2>&1; then
            # A re-run: replace the files and notes of the existing release.
            gh release upload "$tag" dist/* --clobber
            gh release edit "$tag" --notes-file release-notes.md
          else
            flags=()
            if [[ "$PRERELEASE" == "true" ]]; then flags+=(--prerelease); fi
            gh release create "$tag" dist/* \
              --draft \
              --verify-tag \
              --title "MeloDesk $VERSION" \
              --notes-file release-notes.md \
              "${flags[@]}"
          fi
